<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MentorQ Live Session Focus Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sora: ['Sora', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
            space: ['Space Grotesk', 'monospace'],
          },
          colors: {
            canvas: '#F5F4F0',
            track: '#E5E4E0',
            violetPrimary: '#6C5CE7',
            mintAccent: '#00B894',
            dangerRed: '#E17055',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F4F0;
      color: #1E1B2E;
      font-family: 'Inter', sans-serif;
    }
    .concentric-circle {
      border: 1px solid rgba(108, 92, 231, 0.04);
      border-radius: 9999px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden select-none bg-[#F5F4F0]">

  <!-- Ambient Aurora Glow Blobs (blurred 5% opacity) -->
  <div class="absolute -top-40 -left-40 w-[550px] h-[550px] rounded-full bg-[#6C5CE7] opacity-[0.05] blur-[120px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-[550px] h-[550px] rounded-full bg-[#00B894] opacity-[0.05] blur-[120px] pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full bg-[#6C5CE7] opacity-[0.03] blur-[140px] pointer-events-none"></div>

  <!-- Concentric Geometric Rings in the background (faint ~3% opacity) -->
  <div class="concentric-circle w-[420px] h-[420px]"></div>
  <div class="concentric-circle w-[580px] h-[580px]"></div>
  <div class="concentric-circle w-[760px] h-[760px]"></div>
  <div class="concentric-circle w-[960px] h-[960px]"></div>

  <!-- TOP BAR -->
  <header class="relative z-20 w-full px-8 lg:px-12 py-5 flex items-center justify-between border-b border-[#E7E5E0]/60 backdrop-blur-sm bg-[#F5F4F0]/70">
    <!-- Left: MentorQ Logo -->
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#6C5CE7] to-[#8075ea] flex items-center justify-center text-white font-sora font-extrabold text-sm shadow-sm opacity-90">
        <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <span class="font-sora font-bold text-base tracking-tight text-[#2D3436]/80">Mentor<span class="text-[#6C5CE7]">Q</span></span>
    </div>

    <!-- Center: Session Info Strip -->
    <div class="flex items-center gap-3 px-4 py-1.5 rounded-full bg-[#ECEAE4]/80 border border-[#DFDDD6]/70 shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
      <span class="font-sora font-semibold text-xs md:text-sm text-[#2D3436]">React Hooks &amp; State Management</span>
      <span class="w-1 h-1 rounded-full bg-[#B2BEC3]"></span>
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 rounded-full bg-[#6C5CE7]/15 text-[#6C5CE7] font-semibold text-[10px] flex items-center justify-center font-sora ring-1 ring-[#6C5CE7]/30">
          PS
        </div>
        <span class="font-inter text-xs text-[#636E72]">with Priya Sharma</span>
      </div>
    </div>

    <!-- Right: Leave Session Action -->
    <div>
      <button class="group flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-inter font-medium text-[#E17055] hover:text-[#D63031] hover:bg-[#E17055]/10 transition-all">
        <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Leave Session</span>
      </button>
    </div>
  </header>

  <!-- CENTER OF SCREEN: FOCAL TIMER & STATUS -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-8">
    <div class="flex flex-col items-center">
      
      <!-- Circular Progress Ring (280px diameter) -->
      <div class="relative w-[280px] h-[280px] flex items-center justify-center">
        <!-- SVG Ring -->
        <svg class="w-[280px] h-[280px] -rotate-90 transform" viewBox="0 0 280 280">
          <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C5CE7" />
              <stop offset="100%" stop-color="#00B894" />
            </linearGradient>
            <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6C5CE7" flood-opacity="0.15" />
            </filter>
          </defs>
          
          <!-- Outer track ring -->
          <circle
            cx="140"
            cy="140"
            r="126"
            stroke="#E5E4E0"
            stroke-width="8"
            fill="none"
          />

          <!-- Animated / styled progress fill (Circumference ~791.68px; 24:37 / 30:00 = 82% remaining -> dashoffset ~142px) -->
          <circle
            cx="140"
            cy="140"
            r="126"
            stroke="url(#timerGradient)"
            stroke-width="8"
            stroke-linecap="round"
            fill="none"
            stroke-dasharray="791.68"
            stroke-dashoffset="142"
            filter="url(#softGlow)"
            class="transition-all duration-1000 ease-out"
          />
        </svg>

        <!-- Centered Countdown Content -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span class="font-sora font-extrabold text-[56px] leading-none tracking-tight text-[#1E1B2E]">
            24:37
          </span>
          <span class="font-inter text-xs font-medium uppercase tracking-widest text-[#7F8C8D] mt-2.5">
            remaining
          </span>
        </div>
      </div>

      <!-- Below Ring Total Duration -->
      <div class="mt-4">
        <span class="font-space font-medium text-xs tracking-wide text-[#7F8C8D] bg-[#ECEAE4]/90 px-3 py-1 rounded-full border border-[#E0DED7]">
          of 30:00 total
        </span>
      </div>

      <!-- Session Status (below timer, 24px gap) -->
      <div class="mt-6 flex flex-col items-center gap-2">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#E6FAF4] border border-[#00B894]/25 shadow-sm">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00B894] opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-[#00B894]"></span>
          </span>
          <span class="font-inter text-xs font-semibold text-[#008F72] tracking-wide">
            In Progress
          </span>
        </div>
        <p class="font-inter text-xs text-[#8A959E]">
          Started at 10:15 AM
        </p>
      </div>

    </div>
  </main>

  <!-- BOTTOM CONTROLS BAR (Fixed/Floating centered, 48px from bottom) -->
  <footer class="relative z-30 w-full flex justify-center pb-12 pt-2 px-4 pointer-events-none">
    
    <!-- Floating Control Bar Card -->
    <div class="relative pointer-events-auto flex items-end gap-5 sm:gap-6 px-6 py-4 rounded-full bg-[#FAFAF8] border border-[#E7E5E0] shadow-[0_12px_32px_rgba(30,27,46,0.08),0_2px_6px_rgba(30,27,46,0.03)] backdrop-blur-md">
      
      <!-- Pause Button -->
      <div class="flex flex-col items-center gap-1.5">
        <button class="w-12 h-12 rounded-full bg-[#FFF8E7] hover:bg-[#FFECC2] active:scale-95 border border-[#F1C40F]/40 flex items-center justify-center text-[#D68910] transition-all shadow-sm group" title="Pause Session">
          <svg class="w-5 h-5 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>
        <span class="font-inter text-[11px] font-medium text-[#636E72]">Pause</span>
      </div>

      <!-- Extend Time Button with Open Dropdown -->
      <div class="relative flex flex-col items-center gap-1.5">
        <!-- Expanded Popover Dropdown (shown open for visual interest as requested) -->
        <div class="absolute -top-[104px] left-1/2 -translate-x-1/2 w-32 bg-[#FAFAF8] border border-[#6C5CE7]/30 rounded-2xl shadow-[0_8px_24px_rgba(108,92,231,0.12)] p-1.5 flex flex-col gap-1 z-40 animate-fade-in">
          <div class="text-[10px] font-semibold text-[#6C5CE7] uppercase tracking-wider px-2 py-0.5">Extend Time</div>
          <button class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-inter font-medium text-[#2D3436] hover:bg-[#6C5CE7]/10 hover:text-[#6C5CE7] transition-colors flex items-center justify-between">
            <span>+5 min</span>
            <span class="text-[10px] text-[#A0AEC0]">+1 credit</span>
          </button>
          <button class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-inter font-medium text-[#2D3436] hover:bg-[#6C5CE7]/10 hover:text-[#6C5CE7] transition-colors flex items-center justify-between">
            <span>+10 min</span>
            <span class="text-[10px] text-[#A0AEC0]">+2 credits</span>
          </button>
        </div>

        <button class="w-12 h-12 rounded-full bg-[#F3F0FD] hover:bg-[#EBE5FC] active:scale-95 border border-[#6C5CE7]/50 flex items-center justify-center text-[#6C5CE7] transition-all shadow-sm group" title="Extend Session Time">
          <svg class="w-5 h-5 transition-transform group-hover:rotate-90 duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <span class="font-inter text-[11px] font-medium text-[#6C5CE7] font-semibold">Extend</span>
      </div>

      <!-- Large Prominent END SESSION Button -->
      <div class="flex flex-col items-center gap-1.5">
        <button class="h-12 px-6 rounded-full bg-[#E17055] hover:bg-[#D65A3D] active:scale-95 text-white flex items-center gap-2.5 shadow-[0_4px_16px_rgba(225,112,85,0.35)] transition-all font-inter font-semibold text-sm group" title="End Current Session">
          <svg class="w-4 h-4 fill-current transition-transform group-hover:scale-95" viewBox="0 0 24 24">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
          </svg>
          <span>End Session</span>
        </button>
        <span class="h-[14px]"></span> <!-- balancing spacer for labels below other buttons -->
      </div>

      <!-- Chat Button with Notification Badge -->
      <div class="flex flex-col items-center gap-1.5">
        <div class="relative">
          <button class="w-12 h-12 rounded-full bg-[#F3F0FD] hover:bg-[#EBE5FC] active:scale-95 border border-[#6C5CE7]/30 flex items-center justify-center text-[#6C5CE7] transition-all shadow-sm group" title="Open Chat">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
          <!-- Badge showing '1' new message -->
          <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#6C5CE7] text-white text-[10px] font-sora font-bold flex items-center justify-center ring-2 ring-[#FAFAF8] shadow-sm">
            1
          </span>
        </div>
        <span class="font-inter text-[11px] font-medium text-[#636E72]">Chat</span>
      </div>

    </div>
  </footer>

</body>
</html>
